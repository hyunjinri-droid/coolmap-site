name: Update shelter data

on:
  schedule:
    # 매주 월요일 04:00 UTC (KST 13:00)
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      debug:
        description: "DEBUG=1로 실행해 원본 응답 구조를 로그에 출력"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-shelters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-shelters.mjs
        env:
          SHELTERS_API_KEY: ${{ secrets.SHELTERS_API_KEY }}
          SAFEMAP_PROXY_URL: ${{ secrets.SAFEMAP_PROXY_URL }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/shelters.json; then
            git add src/data/shelters.json
            git commit -m "chore: 무더위쉼터 데이터 갱신"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "변경 없음"
          fi
